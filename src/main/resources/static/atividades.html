<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atividades</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-warning"><div class="container"><a class="navbar-brand text-dark" href="/index.html">Jogo Autismo</a><button onclick="sair()" class="btn btn-light btn-sm">Sair</button></div></nav><main class="container mt-4"><h2 class="fw-bold">Gestão de Atividades Educativas</h2><div class="card mb-4"><div class="card-body"><form id="form" class="row g-3"><input type="hidden" id="id"><div class="col-md-3"><label>Título</label><input id="titulo" class="form-control" required></div><div class="col-md-4"><label>Descrição</label><input id="descricao" class="form-control"></div><div class="col-md-3"><label>Nível</label><select id="nivelDificuldade" class="form-select"><option value="FACIL">Fácil</option><option value="MEDIO">Médio</option><option value="DIFICIL">Difícil</option></select></div><div class="col-md-2"><label>Tempo estimado</label><input id="tempoEstimado" type="number" class="form-control"></div><div class="col-12"><button class="btn btn-warning">Guardar</button><button type="button" onclick="limpar()" class="btn btn-outline-secondary">Limpar</button></div></form></div></div><div class="card"><div class="card-body table-responsive"><table class="table table-striped"><thead><tr><th>ID</th><th>Título</th><th>Descrição</th><th>Nível</th><th>Tempo</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table></div></div></main><script src="/js/api.js"></script><script>exigePerfis('EDUCADOR','ADMIN');async function carregar(){const arr=await api('/api/atividades');tbody.innerHTML=arr.map(r=>`<tr><td>${r.id}</td><td>${r.titulo||''}</td><td>${r.descricao||''}</td><td>${r.nivelDificuldade||''}</td><td>${r.tempoEstimado||''} min</td><td><button class="btn btn-warning btn-sm" onclick='editar(${JSON.stringify(r)})'>Editar</button> <button class="btn btn-danger btn-sm" onclick="remover(${r.id})">Remover</button></td></tr>`).join('')}function editar(r){id.value=r.id;titulo.value=r.titulo||'';descricao.value=r.descricao||'';nivelDificuldade.value=r.nivelDificuldade||'FACIL';tempoEstimado.value=r.tempoEstimado||''}function limpar(){form.reset();id.value=''}async function remover(i){if(confirm('Remover atividade?')){await api('/api/atividades/'+i,{method:'DELETE'});carregar()}}form.onsubmit=async e=>{e.preventDefault();const obj={titulo:titulo.value,descricao:descricao.value,nivelDificuldade:nivelDificuldade.value,tempoEstimado:Number(tempoEstimado.value||0)};await api('/api/atividades'+(id.value?'/'+id.value:''),{method:id.value?'PUT':'POST',body:JSON.stringify(obj)});limpar();carregar()};carregar()</script></body></html>
