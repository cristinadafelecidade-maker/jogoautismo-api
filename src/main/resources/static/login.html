<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - Jogo Autismo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-primary">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card" style="max-width:520px;width:100%">
        <div class="card-body p-5">
            <h1 class="text-primary fw-bold text-center">Jogo Autismo</h1>
            <p class="text-muted text-center">Sistema educativo inclusivo</p>
            <div id="erro" class="alert alert-danger hidden"></div>
            <form id="loginForm">
                <label class="form-label">Email</label>
                <input id="email" class="form-control mb-3" type="email" required placeholder="admin@jogoautismo.mz">
                <label class="form-label">Senha</label>
                <input id="senha" class="form-control mb-4" type="password" required placeholder="admin123">
                <button class="btn btn-primary w-100">Entrar</button>
            </form>
            <hr>
            <div class="small text-muted">
                <b>Credenciais:</b><br>
                ADMIN: admin@jogoautismo.mz / admin123<br>
                EDUCADOR: fatima@escola.mz / admin123<br>
                ENCARREGADO: maria@gmail.com / admin123<br>
                ALUNO: nilton@aluno.mz / admin123
            </div>
        </div>
    </div>
</div>
<script>
function destinoPorPerfil(perfil){
    if(perfil==='ADMIN') return '/dashboard-admin.html';
    if(perfil==='EDUCADOR') return '/atividades.html';
    if(perfil==='ENCARREGADO') return '/sessoes.html';
    if(perfil==='ALUNO') return '/jogos.html';
    return '/login.html';
}

document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const erro=document.getElementById('erro');
    erro.classList.add('hidden');
    try{
        const r=await fetch('/api/auth/login',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email:email.value,senha:senha.value})
        });
        if(!r.ok)throw new Error('Email ou senha inválidos');
        const d=await r.json();
        localStorage.setItem('token',d.token);
        localStorage.setItem('perfil',d.perfil);
        localStorage.setItem('nome',d.nome);
        localStorage.setItem('email',d.email);
        if(d.usuarioId) localStorage.setItem('usuarioId',d.usuarioId);
        if(d.educadorId) localStorage.setItem('educadorId',d.educadorId);
        if(d.encarregadoId) localStorage.setItem('encarregadoId',d.encarregadoId);
        if(d.alunoId) localStorage.setItem('alunoId',d.alunoId);
        location.href=destinoPorPerfil(d.perfil);
    }catch(ex){
        erro.textContent=ex.message;
        erro.classList.remove('hidden');
    }
});
</script>
</body>
</html>
