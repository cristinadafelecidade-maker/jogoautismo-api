<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crianças</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/index.html">Jogo Autismo</a><button onclick="sair()" class="btn btn-light btn-sm">Sair</button></div></nav><main class="container mt-4"><h2 class="fw-bold">Cadastro de Crianças/Alunos</h2><div id="msg" class="alert hidden"></div><div class="card mb-4"><div class="card-body"><form id="form" class="row g-3"><input type="hidden" id="id"><div class="col-md-4"><label>Nome</label><input id="nome" class="form-control" required></div><div class="col-md-4"><label>Apelido</label><input id="apelido" class="form-control"></div><div class="col-md-4"><label>NUIT</label><input id="nuit" class="form-control"></div><div class="col-md-3"><label>Género</label><select id="genero" class="form-select"><option value="MASCULINO">Masculino</option><option value="FEMININO">Feminino</option><option value="OUTRO">Outro</option></select></div><div class="col-md-3"><label>Nível de autismo</label><select id="nivelAutismo" class="form-select"><option value="LEVE">Leve</option><option value="MEDIO">Médio</option><option value="SEVERO">Severo</option></select></div><div class="col-md-3"><label>Encarregado</label><select id="encarregadoId" class="form-select" required></select></div><div class="col-md-3"><label>Necessidade especial</label><input id="necessidadeEspecial" class="form-control"></div><div class="col-12"><button class="btn btn-primary">Guardar</button><button type="button" onclick="limpar()" class="btn btn-outline-secondary">Limpar</button></div></form></div></div><div class="card"><div class="card-body table-responsive"><table class="table table-striped"><thead><tr><th>ID</th><th>Nome</th><th>NUIT</th><th>Género</th><th>Nível</th><th>Encarregado</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table></div></div></main><script src="/js/api.js"></script><script>exigePerfis('EDUCADOR','ADMIN');async function carregar(){await preencherSelect('encarregadoId','/api/encarregados',x=>x.nome);const arr=await api('/api/alunos');tbody.innerHTML=arr.map(a=>`<tr><td>${a.id}</td><td>${a.nome||''} ${a.apelido||''}</td><td>${a.nuit||''}</td><td>${a.genero||''}</td><td>${a.nivelAutismo||''}</td><td>${a.encarregado?.nome||''}</td><td><button class="btn btn-warning btn-sm" onclick='editar(${JSON.stringify(a)})'>Editar</button> <button class="btn btn-danger btn-sm" onclick="remover(${a.id})">Remover</button></td></tr>`).join('')}function editar(a){id.value=a.id;nome.value=a.nome||'';apelido.value=a.apelido||'';nuit.value=a.nuit||'';genero.value=a.genero||'MASCULINO';nivelAutismo.value=a.nivelAutismo||'LEVE';necessidadeEspecial.value=a.necessidadeEspecial||'';encarregadoId.value=a.encarregado?.id||''}function limpar(){form.reset();id.value=''}async function remover(i){if(confirm('Remover aluno?')){await api('/api/alunos/'+i,{method:'DELETE'});carregar()}}form.onsubmit=async e=>{e.preventDefault();const obj={nome:nome.value,apelido:apelido.value,nuit:nuit.value,genero:genero.value,nivelAutismo:nivelAutismo.value,necessidadeEspecial:necessidadeEspecial.value,encarregadoId:Number(encarregadoId.value)};await api('/api/alunos'+(id.value?'/'+id.value:''),{method:id.value?'PUT':'POST',body:JSON.stringify(obj)});limpar();carregar()};carregar()</script></body></html>
