<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsáveis</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-success"><div class="container"><a class="navbar-brand" href="/index.html">Jogo Autismo</a><button onclick="sair()" class="btn btn-light btn-sm">Sair</button></div></nav><main class="container mt-4"><h2 class="fw-bold">Cadastro de Encarregados/Responsáveis</h2><div class="card mb-4"><div class="card-body"><form id="form" class="row g-3"><input type="hidden" id="id"><div class="col-md-3"><label>Nome</label><input id="nome" class="form-control" required></div><div class="col-md-3"><label>Email</label><input id="email" type="email" class="form-control"></div><div class="col-md-3"><label>Celular</label><input id="celular" class="form-control"></div><div class="col-md-3"><label>Parentesco</label><input id="parentesco" class="form-control"></div><div class="col-12"><button class="btn btn-success">Guardar</button><button type="button" onclick="limpar()" class="btn btn-outline-secondary">Limpar</button></div></form></div></div><div class="card"><div class="card-body table-responsive"><table class="table table-striped"><thead><tr><th>ID</th><th>Nome</th><th>Email</th><th>Celular</th><th>Parentesco</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table></div></div></main><script src="/js/api.js"></script><script>exigePerfis('ADMIN');async function carregar(){const arr=await api('/api/encarregados');tbody.innerHTML=arr.map(r=>`<tr><td>${r.id}</td><td>${r.nome||''}</td><td>${r.email||''}</td><td>${r.celular||''}</td><td>${r.parentesco||''}</td><td><button class="btn btn-warning btn-sm" onclick='editar(${JSON.stringify(r)})'>Editar</button> <button class="btn btn-danger btn-sm" onclick="remover(${r.id})">Remover</button></td></tr>`).join('')}function editar(r){id.value=r.id;nome.value=r.nome||'';email.value=r.email||'';celular.value=r.celular||'';parentesco.value=r.parentesco||''}function limpar(){form.reset();id.value=''}async function remover(i){if(confirm('Remover responsável?')){await api('/api/encarregados/'+i,{method:'DELETE'});carregar()}}form.onsubmit=async e=>{e.preventDefault();const obj={nome:nome.value,email:email.value,celular:celular.value,parentesco:parentesco.value};await api('/api/encarregados'+(id.value?'/'+id.value:''),{method:id.value?'PUT':'POST',body:JSON.stringify(obj)});limpar();carregar()};carregar()</script></body></html>
